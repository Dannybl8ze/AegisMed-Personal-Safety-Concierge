[project]
name = "aegismed-agent"
version = "0.1.0"
description = "AegisMed Personal Safety Concierge Agent"
authors = [
    {name = "Sunday Daniel Friday", email = "sdfridaysd@gmail.com"},
]
# The single dependency manifest: Vercel, the Dockerfile and local installs all read it.
dependencies = [
    "google-adk>=2.2.0,<3.0.0",
    "fastapi>=0.110.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "upstash-redis>=1.4.0",
]
requires-python = ">=3.12,<3.14"

[project.optional-dependencies]
# FastMCP server (server.py)
mcp = ["fastmcp>=0.1.0"]
# Vertex AI Agent Runtime deployment (app/agent_runtime_app.py)
gcp = ["google-adk[gcp]>=2.2.0,<3.0.0", "python-dotenv"]
dev = ["pytest>=8.0", "httpx>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "dashboard_api"]

[tool.vercel]
entrypoint = "dashboard_api.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["tests/eval"]
